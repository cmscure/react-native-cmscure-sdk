name: Registry install

# Installs the PUBLISHED package from npm (not this checkout) into a fresh
# Expo app and runs it on Android and iOS. Run after every npm publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to test
        required: true
        default: 0.3.1
  push:
    branches: [main]
    paths: ['.github/workflows/registry.yml']

env:
  VERSION: ${{ github.event.inputs.version || '0.3.1' }}

jobs:
  android:
    name: Android, registry ${{ github.event.inputs.version || '0.3.1' }}, Expo 55
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fresh Expo 55 app with the published package
        run: bash .github/scripts/registry-app.sh
      - name: Build release APK
        working-directory: fresh/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: APP_DIR=fresh bash .github/scripts/android-smoke.sh

  ios:
    name: iOS, registry ${{ github.event.inputs.version || '0.3.1' }}, Expo 55
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fresh Expo 55 app with the published package
        run: PLATFORM=ios bash .github/scripts/registry-app.sh
      - name: Build Release for simulator
        working-directory: fresh/ios
        run: |
          WS="$(ls -d *.xcworkspace | head -1)"
          xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || {
              grep -n -E "error:" xcodebuild.log | head -60; exit 1; }
      - name: Run on simulator
        run: APP_DIR=fresh bash .github/scripts/ios-smoke.sh
