name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS tests, types, web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: bash .github/scripts/prepare-example.sh
      - name: Typecheck example against index.d.ts
        working-directory: example-expo
        run: npx tsc --noEmit
      - name: Web export (react-native-web uses src/bridge.web.js)
        working-directory: example-expo
        run: |
          npx expo export --platform web --output-dir dist
          if grep -q "CMSCureSDK native module" dist/_expo/static/js/web/*.js; then
            echo "web bundle pulled in the native bridge"; exit 1
          fi

  android:
    name: Android, Expo SDK ${{ matrix.expo }} (New Architecture)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expo: ['55', '58']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install example
        run: bash .github/scripts/prepare-example.sh ${{ matrix.expo }}
      - name: Prebuild (config plugin)
        working-directory: example-expo
        run: |
          npx expo prebuild --platform android --no-install
          grep -q "newArchEnabled=true" android/gradle.properties
      - name: Build release APK
        working-directory: example-expo/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

  ios:
    name: iOS, Expo SDK ${{ matrix.expo }} (New Architecture)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        expo: ['55', '58']
    steps:
      - uses: actions/checkout@v4
      # Expo SDK 55+ needs Swift 6.2 (Xcode 26); the image default is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install example
        run: bash .github/scripts/prepare-example.sh ${{ matrix.expo }}
      - name: Prebuild (config plugin) and pods
        working-directory: example-expo
        run: |
          npx expo prebuild --platform ios
          grep -q '"ios.useFrameworks": "static"' ios/Podfile.properties.json
      - name: Build Release for simulator
        working-directory: example-expo/ios
        run: |
          WS="$(ls -d *.xcworkspace | head -1)"
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || {
              grep -n -E "error:|error\]" xcodebuild.log | head -80
              grep -n -A12 "following build commands failed" xcodebuild.log
              exit 1
            }
          tail -5 xcodebuild.log
      - name: Run on simulator
        run: bash .github/scripts/ios-smoke.sh
      - name: Keep build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-expo-${{ matrix.expo }}
          path: example-expo/ios/xcodebuild.log
          if-no-files-found: ignore
