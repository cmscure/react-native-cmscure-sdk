buildscript {    
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}


def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace "com.reactnativecmscuresdk"
    
    compileSdkVersion getExtOrDefault("compileSdkVersion", 35)
    
    defaultConfig {
        minSdk getExtOrDefault("minSdkVersion", 24)
        targetSdk getExtOrDefault("targetSdkVersion", 35)
        versionCode 1
        versionName "1.0"
    }
    
    
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // React Native (the RN Gradle plugin maps this to react-android)
    compileOnly 'com.facebook.react:react-native:+'
    
    // Kotlin stdlib comes from the Kotlin Gradle plugin of the host app.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Socket.IO
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    
    // Image prefetch (plain Coil, no Jetpack Compose: Compose is not used by
    // this module and its compiler setup breaks apps on Kotlin 2.x)
    implementation 'io.coil-kt:coil:2.5.0'
}
